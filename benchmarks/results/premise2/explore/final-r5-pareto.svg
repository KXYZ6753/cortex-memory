<text x="80" y="642" font-size="10.5" fill="#555">Panel A: S300-1 points are the stored runs (P-B, gates, g5, t-lk, x1) and the lead's q1 run; FULL-2 points are the lead's det-wrapped confirmation arms. Wall time includes BM25, the CPU cross-encoder and every model call (det resets included).</text>
<text x="80" y="658" font-size="10.5" fill="#555">Panel B: GPU board power (RTX 5060 Ti) integrated per question window, gross (idle not subtracted). S300-1: worker i's energy re-runs (byte-identical to the stored runs) and q1; FULL-2: the same det arms as panel A. g5 has no energy run.</text>
<text x="80" y="674" font-size="10.5" fill="#555">det = every model call preceded by a fixed reset call, so answers do not depend on earlier questions; det arms are compared only with det arms.</text>
